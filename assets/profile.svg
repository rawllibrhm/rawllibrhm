<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Software developer and 3D designer studying at Politeknik Negeri Malang. Works across game development, embedded systems, and interface design, with an emphasis on clean, maintainable code and intuitive user experience. Committed to open source and to turning ideas into dependable products.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#121a33"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F5D4"/><stop offset=".5" stop-color="#9B5DE5"/><stop offset="1" stop-color="#F15BB5"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>@keyframes p0{0%,2%{opacity:0;transform:translateX(-26px)}8%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(14px)}}
.p0{animation:p0 16s ease-out infinite both}
@keyframes p1{0%,9%{opacity:0;transform:translateX(-26px)}15%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(14px)}}
.p1{animation:p1 16s ease-out infinite both}
@keyframes p2{0%,16%{opacity:0;transform:translateX(-26px)}22%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(14px)}}
.p2{animation:p2 16s ease-out infinite both}
@keyframes p3{0%,23%{opacity:0;transform:translateX(-26px)}29%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(14px)}}
.p3{animation:p3 16s ease-out infinite both}

.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.bar{animation:bh 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bh{0%,100%{transform:scaleY(.86);opacity:.7}50%{transform:scaleY(1);opacity:1}}
</style></defs>
<rect width="1200" height="230" rx="14" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="229" rx="14" fill="none" stroke="#1d2640"/>
<rect class="bar" x="30" y="36" width="4" height="158" rx="2" fill="url(#bar)"/>
<text class="p0" x="64" y="64" style="font:600 26px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#ffffff">Software developer and 3D designer studying at Politeknik Negeri Malang.</text>
<text class="p1" x="64" y="112" style="font:400 20px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#a9b6d3">Works across game development, embedded systems, and interface design,</text>
<text class="p2" x="64" y="146" style="font:400 20px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#a9b6d3">with an emphasis on clean, maintainable code and intuitive user experience.</text>
<text class="p3" x="64" y="180" style="font:400 20px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#a9b6d3">Committed to open source and to turning ideas into dependable products.</text>

<rect x="-300" y="0" width="300" height="230" fill="url(#sw)"><animate attributeName="x" from="-300" to="1200" dur="8s" repeatCount="indefinite"/></rect>
</svg>