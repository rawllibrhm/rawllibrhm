<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="PROFILE">
<defs>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5D4"/><stop offset=".5" stop-color="#9B5DE5"/><stop offset="1" stop-color="#F15BB5" stop-opacity="0"/></linearGradient>
<linearGradient id="bm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>
.i{font:700 15px 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#00F5D4;letter-spacing:2px;animation:gl 3.6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
.t{font:700 22px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;letter-spacing:9px;fill:#e6edf3;animation:in 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.d{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></defs>
<rect width="1200" height="60" rx="12" fill="#0b0f19"/>
<rect x=".5" y=".5" width="1199" height="59" rx="12" fill="none" stroke="#1d2640"/>
<text class="i" x="28" y="37">01</text>
<rect class="d" x="66" y="26" width="8" height="8" fill="none" stroke="#F15BB5" stroke-width="1.5"/>
<text class="t" x="94" y="38">PROFILE</text>
<rect x="253" y="29.25" width="919" height="1.5" fill="url(#ln)"/>
<rect x="253" y="28.5" width="140" height="3" fill="url(#bm)" opacity=".9"><animate attributeName="x" from="233" to="1030" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>