<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Focus areas: game development, 3D design, robotics, web and UI/UX">
<defs><linearGradient id="a0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset=".5" stop-color="#00F5D4"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/></linearGradient><linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9B5DE5" stop-opacity="0"/><stop offset=".5" stop-color="#9B5DE5"/><stop offset="1" stop-color="#9B5DE5" stop-opacity="0"/></linearGradient><linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F15BB5" stop-opacity="0"/><stop offset=".5" stop-color="#F15BB5"/><stop offset="1" stop-color="#F15BB5" stop-opacity="0"/></linearGradient><linearGradient id="a3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00BBF9" stop-opacity="0"/><stop offset=".5" stop-color="#00BBF9"/><stop offset="1" stop-color="#00BBF9" stop-opacity="0"/></linearGradient><clipPath id="cl"><rect width="270" height="230" rx="14"/></clipPath><style>
